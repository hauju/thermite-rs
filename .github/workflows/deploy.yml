name: Build image

# Builds the Rust/WASM bundle OUTSIDE Docker (so cargo caching works), then the
# Dockerfile only packages the artifacts. Nothing compiles on the host that runs it.
#
# One build, two destinations:
#
#   - ghcr.io/<owner>/thermite — the public image self-hosters pull. Always pushed,
#     authenticated with the workflow's own GITHUB_TOKEN, so a clone needs no secrets
#     configured to produce an image of its own.
#   - ${{ vars.REGISTRY }}/thermite — an optional second registry for private
#     deployments. Set the REGISTRY / REGISTRY_USERNAME variables and the
#     REGISTRY_PASSWORD secret; leave them unset and this half is skipped.
#
# Two architectures, each bundled on its own native runner. The bundle carries a
# native server binary, so an arm64 image cannot be packaged from an amd64 build —
# and cross-compiling it would mean a second linker and sysroot to keep working.
# Only the runtime image's apt layer is emulated, which is why QEMU appears here.
#
# This workflow builds and pushes only; rolling the image out is a separate,
# manual step on the host.

on:
  push:
    branches: [main]
  workflow_dispatch:

# `packages: write` is what lets the default GITHUB_TOKEN push to GHCR.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: thermite

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          # rust-toolchain.toml pins the channel; this adds the wasm target.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Generate Tailwind CSS
        run: |
          bun install --frozen-lockfile
          bunx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css

      - name: Build web bundle
        run: dx bundle --web --release

      # Tarred rather than uploaded as a tree: the artifact upload drops the
      # executable bit, and the image's entrypoint is that server binary.
      - name: Pack the bundle
        run: tar -C target/dx/thermite/release/web -cf bundle-${{ matrix.arch }}.tar .

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: bundle-${{ matrix.arch }}.tar
          retention-days: 1

  push:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      # The Dockerfile copies dist/<arch>, so each platform of the same build gets
      # the binary that was compiled for it.
      - name: Unpack the bundles
        run: |
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            tar -C "dist/$arch" -xf "bundles/bundle-$arch.tar"
          done

      # GHCR namespaces images by owner and rejects uppercase, so the owner is
      # lowercased rather than assumed. A private registry is appended only when one
      # is configured — on a fork that is nothing, and the public tags still stand.
      - name: Work out the tags
        id: tags
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          public="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          {
            echo "tags<<EOF"
            echo "$public:latest"
            echo "$public:$SHA"
            if [ -n "$REGISTRY" ]; then
              echo "$REGISTRY/$IMAGE_NAME:latest"
              echo "$REGISTRY/$IMAGE_NAME:$SHA"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Docker build just packages the prebuilt artifacts (see Dockerfile). QEMU
      # covers the arm64 apt layer; nothing of the application is emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gated on the variable, not the secret: the secrets context is unreadable
      # from an `if`, and a clone with neither configured skips this half anyway.
      - name: Log in to the private registry
        if: vars.REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # `image.source` is what links the GHCR package back to this repository,
          # which is also what lets the package inherit the repo's visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted, agent-native error tracking that speaks Sentry's wire protocol
            org.opencontainers.image.licenses=AGPL-3.0-only
