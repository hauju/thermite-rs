<!--
  The favicon, both ways: served directly to SVG-capable browsers (main.rs's
  FAVICON_SVG) and rendered to favicon.ico for the rest. Regenerate the .ico
  with `just icons`.

  Both consumers must be this file. Pointing the SVG link at assets/mark.svg
  instead ships two different brand marks — a dark badge in Safari, a bare
  floating triangle in Chrome — in the same tab strip.

  Tighter padding and a heavier stroke than icon.svg: a favicon is read at
  16px, where the PWA icon's margin and hairline collapse into a smudge. The
  dark plate is kept rather than going transparent so the mark holds its shape
  against a light *and* a dark browser tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#e2401f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(88 88) scale(14)">
    <path d="M10.42 3.9 2.77 17.16a1.83 1.83 0 0 0 1.58 2.74h15.3a1.83 1.83 0 0 0 1.58-2.74L13.58 3.9a1.83 1.83 0 0 0-3.16 0Z" stroke="url(#shell)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M12 10.6l3.55 6.15a.62.62 0 0 1-.54.93H8.99a.62.62 0 0 1-.54-.93Z" fill="url(#core)" stroke="url(#shell)" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
