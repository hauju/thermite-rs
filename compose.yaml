# Host ports are offset off the defaults so this stack runs alongside other
# projects' Postgres/Mailpit containers, and bound to 127.0.0.1 so a dev
# database with default credentials is never reachable from the network.
services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: thermite
      POSTGRES_PASSWORD: thermite
      POSTGRES_DB: thermite
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermite -d thermite"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    # Pinned: `latest` silently changes the SMTP behaviour under a dev stack.
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8028:8025"  # Web UI
      - "127.0.0.1:1028:1025"  # SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
